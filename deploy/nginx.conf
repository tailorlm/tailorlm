server {
    listen 80;
    listen [::]:80;
    server_name tailorlm.mcocdaa.com;

    root /var/www/tailorlm;
    index index.html;

    location / {
        try_files $uri $uri/ /404.html;
    }

    location = /404.html {
        internal;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
